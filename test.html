<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>이벤트 카운트다운</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #000;
            color: #C02025;
            /* Ferrari Red */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Roboto Mono', monospace;
        }

        .countdown-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }

        .time-block {
            text-align: center;
        }

        .time-value {
            font-size: 72px;
            letter-spacing: 2px;
            min-width: 90px;
            display: inline-block;
        }

        .time-label {
            font-size: 16px;
            color: #004000;
            /* Green for labels */
            margin-top: 8px;
            display: block;
            text-transform: uppercase;
        }

        .colon {
            font-size: 64px;
            color: #004000;
            margin-top: -10px;
        }

        @media (max-width: 600px) {
            .time-value {
                font-size: 48px;
                min-width: 60px;
            }

            .time-label {
                font-size: 12px;
            }

            .colon {
                font-size: 40px;
            }
        }
    </style>
</head>

<body>

    <div class="countdown-wrapper">
        <div class="time-block">
            <span class="time-value" id="days">00</span>
            <span class="time-label">day</span>
        </div>
        <span class="colon">:</span>
        <div class="time-block">
            <span class="time-value" id="hours">00</span>
            <span class="time-label">hour</span>
        </div>
        <span class="colon">:</span>
        <div class="time-block">
            <span class="time-value" id="minutes">00</span>
            <span class="time-label">min</span>
        </div>
        <span class="colon">:</span>
        <div class="time-block">
            <span class="time-value" id="seconds">00</span>
            <span class="time-label">sec</span>
        </div>
    </div>

    <script>
        // ✅ 여러 개의 목표 날짜를 순서대로 지정
        // ✅ 한국 시간 기준 목표 날짜 3개
        const targetDates = [
            new Date("2025-11-23T13:00:00+09:00"), // 11/23 오후 1시
            new Date("2025-12-01T01:00:00+09:00"), // 12/1 오전 1시
            new Date("2025-12-07T22:00:00+09:00")  // 12/7 오후 10시
        ];

        let currentIndex = 0;

        // 각 숫자 DOM 참조
        const elDays = document.getElementById("days");
        const elHours = document.getElementById("hours");
        const elMinutes = document.getElementById("minutes");
        const elSeconds = document.getElementById("seconds");

        function two(n) {
            return String(n).padStart(2, "0");
        }

        function updateCountdown() {
            // ✅ 항상 한국 시간 기준으로 계산
            const nowUTC = new Date();
            const nowKST = new Date(nowUTC.getTime() + 9 * 60 * 60 * 1000);

            let diff = targetDates[currentIndex] - nowKST;

            // ✅ 목표 시각이 지났으면 다음 이벤트로 전환
            if (diff <= 0) {
                currentIndex++;
                if (currentIndex >= targetDates.length) currentIndex = 0;
                diff = targetDates[currentIndex] - nowKST;
            }

            const msInSec = 1000;
            const msInMin = msInSec * 60;
            const msInHour = msInMin * 60;
            const msInDay = msInHour * 24;

            const days = Math.floor(diff / msInDay);
            diff %= msInDay;
            const hours = Math.floor(diff / msInHour);
            diff %= msInHour;
            const minutes = Math.floor(diff / msInMin);
            diff %= msInMin;
            const seconds = Math.floor(diff / msInSec);

            elDays.textContent = two(days);
            elHours.textContent = two(hours);
            elMinutes.textContent = two(minutes);
            elSeconds.textContent = two(seconds);
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

    </script>

</body>

</html>
