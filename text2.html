<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동적 일정 리스트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        h1 {
            text-align: center;
        }
        .schedule-container {
            max-width: 800px;
            margin: 20px auto;
        }
        .day {
            margin-bottom: 20px;
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 5px;
        }
        .day h2 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #333;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin: 10px 0;
            padding: 8px;
            background-color: #f4f4f4;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .time {
            font-weight: bold;
            color: #007A33;
        }
    </style>
</head>
<body>
    <div class="schedule-container">
        <h1>3일 일정</h1>

        <div class="day" id="day1">
            <h2>Day 1: 2025년 11월 23일</h2>
            <ul id="schedule-list"></ul> <!-- 하나의 ul만 사용 -->
        </div>

    </div>

    <script>
        // 3일치 일정 데이터를 객체로 정의
        const schedules = [
            { day: "2025년 11월 23일", time: "1:00 PM", activity: "점심 먹기" },
            { day: "2025년 11월 23일", time: "3:00 PM", activity: "회의 참석" },
            { day: "2025년 11월 23일", time: "5:00 PM", activity: "운동하기" },
            { day: "2025년 11월 23일", time: "7:00 PM", activity: "저녁 먹기" },
            { day: "2025년 11월 23일", time: "9:00 PM", activity: "영화 보기" },
            { day: "2025년 11월 24일", time: "9:00 AM", activity: "아침 먹기" },
            { day: "2025년 11월 24일", time: "11:00 AM", activity: "코딩 연습" },
            { day: "2025년 11월 24일", time: "1:00 PM", activity: "점심 먹기" },
            { day: "2025년 11월 24일", time: "3:00 PM", activity: "회의 참석" },
            { day: "2025년 11월 24일", time: "6:00 PM", activity: "친구 만나기" },
            { day: "2025년 11월 25일", time: "8:00 AM", activity: "운동" },
            { day: "2025년 11월 25일", time: "10:00 AM", activity: "프로젝트 작업" },
            { day: "2025년 11월 25일", time: "12:00 PM", activity: "점심 먹기" },
            { day: "2025년 11월 25일", time: "2:00 PM", activity: "업무 진행" },
            { day: "2025년 11월 25일", time: "7:00 PM", activity: "저녁 먹기" }
        ];

        // 일정을 화면에 출력하는 함수
        function displaySchedule() {
            const listElement = document.getElementById('schedule-list');

            // 일정을 ul/li 형식으로 추가
            schedules.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `<span class="time">${item.time}</span>: ${item.activity}`;
                listElement.appendChild(li);
            });
        }

        // 페이지 로드 시 일정을 표시
        window.onload = displaySchedule;
    </script>
</body>
</html>
